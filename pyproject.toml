[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "encbackup"
version = "1.0.0"
description = "Encrypted backups with restic and age: repository password sealed to age keys, key rotation, and verification by restoring a sample against the live files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Standard library only at run time. restic (>= 0.16) and age (>= 1.0) are programs it calls.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3.5",  # the suite spends its time in restic's key derivation, so it parallelises well
  "ruff>=0.4",
  "mypy>=1.10",
  "playwright>=1.45",  # only to render the README screenshot
]

[project.scripts]
encbackup = "encbackup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = ["tools: needs the real restic and age programs"]

[tool.coverage.run]
source = ["encbackup"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E501"]
"tests/*" = ["E501"]
"tools/*" = ["E501"]
